<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoVault — System Status</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="status-page">
    <div class="status-card">
      <h1>CryptoVault</h1>
      <p class="subtitle">Application foundation</p>

      <dl class="status-list">
        <div class="status-row">
          <dt>Firebase App</dt>
          <dd id="status-app" class="pending">Checking…</dd>
        </div>
        <div class="status-row">
          <dt>Authentication Service</dt>
          <dd id="status-auth" class="pending">Checking…</dd>
        </div>
        <div class="status-row">
          <dt>Cloud Firestore</dt>
          <dd id="status-firestore" class="pending">Checking…</dd>
        </div>
      </dl>

      <p class="note">
        No user-facing features yet. Authentication is built in Step 2.
      </p>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
